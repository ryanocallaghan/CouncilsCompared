{# Find a council by postcode or name: /go (functions/go.js) works out which #}
<form class="app-choose" action="/go" method="get" novalidate>
  <div class="govuk-form-group">
    <label class="govuk-label govuk-label--s" for="q">Postcode or council name</label>
    <div class="govuk-hint" id="q-hint">For example, SE14 6AF or Lewisham. A postcode finds your council and the usual council tax band near you, and isn't kept. <a class="govuk-link" href="/privacy/">Privacy</a></div>
    <input class="govuk-input govuk-!-width-two-thirds" id="q" name="q" type="text" spellcheck="false" aria-describedby="q-hint"{% if value %} value="{{ value }}"{% endif %}>
  </div>
  {{ govukButton({"text": "Find my council", "classes": "govuk-!-margin-bottom-0"}) }}
</form>
