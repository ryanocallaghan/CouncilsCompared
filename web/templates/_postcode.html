<form class="app-choose" action="/go" method="get" novalidate>
  <div class="govuk-form-group">
    <label class="govuk-label govuk-label--s" for="postcode">Your postcode</label>
    <div class="govuk-hint" id="postcode-hint">For example, SE14 6AF. Used to find your council and the usual council tax band near you, and not kept. <a class="govuk-link" href="/privacy/">Privacy</a></div>
    <input class="govuk-input govuk-input--width-10" id="postcode" name="postcode" type="text" autocomplete="postal-code" spellcheck="false" aria-describedby="postcode-hint">
  </div>
  {{ govukButton({"text": "Find my council", "classes": "govuk-!-margin-bottom-0"}) }}
</form>
