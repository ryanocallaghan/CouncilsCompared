name: Tell search engines

# When new figures or pages reach main, tell Bing and the other IndexNow
# search engines that the pages changed, so they fetch them again soon.
on:
  push:
    branches: [main]
    paths: ["data/**", "web/**"]
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m web.build site
      # Give Cloudflare Pages time to publish, so the pages fetched are the new ones
      - run: sleep 300
      - run: python -m web.indexnow site/sitemap.xml
